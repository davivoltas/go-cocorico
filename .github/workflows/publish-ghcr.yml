name: Publish GHCR image

on:
  push:
    branches: [ submission ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GHCR_PAT}" ]]; then
            echo "${GHCR_PAT}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          else
            echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          fi

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/go-cocorico:latest
            ghcr.io/${{ github.repository_owner }}/go-cocorico:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image published
        run: echo "Published ghcr.io/${{ github.repository_owner }}/go-cocorico:latest"
