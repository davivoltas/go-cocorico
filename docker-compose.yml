version: '3.8'

services:
  # App 1: primeira instância da API
  app1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOGC: 300
    image: go-cocorico:latest
    container_name: cocorico-app1
    networks:
      - backend
    environment:
      # Diretório dos arquivos de dados (references, mcc_risk, normalization).
      - RESOURCES_DIR=/app/resources
      - REF_PRELOAD_MAX=8000
      - FRAUD_DENY_FROM=2
    volumes:
      # Mount dos arquivos de dados compartilhados (read-only para eficiência).
      - ./resources:/app/resources:ro
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"
        reservations:
          cpus: "0.35"
          memory: "130MB"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9999/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 120s

  # App 2: segunda instância da API (idêntica à app1)
  app2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOGC: 300
    image: go-cocorico:latest
    container_name: cocorico-app2
    networks:
      - backend
    environment:
      - RESOURCES_DIR=/app/resources
      - REF_PRELOAD_MAX=8000
      - FRAUD_DENY_FROM=2
    volumes:
      - ./resources:/app/resources:ro
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"
        reservations:
          cpus: "0.35"
          memory: "130MB"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9999/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 120s

  # Nginx: load balancer com round-robin entre app1 e app2.
  nginx:
    image: nginx:1.27-alpine
    container_name: cocorico-lb
    ports:
      - "9999:9999"
    volumes:
      # Config do nginx (lê a configuração de round-robin).
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - backend
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

networks:
  # Rede bridge (padrão e recomendado para compose).
  backend:
    driver: bridge

# Total de recursos:
# app1:   0.45 CPU, 160 MB
# app2:   0.45 CPU, 160 MB
# nginx:  0.10 CPU,  30 MB
# Total:  1.00 CPU, 350 MB (exactly at the limit!)
