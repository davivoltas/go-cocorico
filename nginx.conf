# Nginx configuration para load balancing round-robin entre 2 instâncias Go.
# Este arquivo não contém lógica de negócio — apenas distribui requisições.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 10000;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # Upstream: define o pool de servidores backend.
    # load_method = default round-robin.
    upstream cocorico_backend {
        server app1:9999 max_fails=3 fail_timeout=30s;
        server app2:9999 max_fails=3 fail_timeout=30s;
        keepalive 256;
    }

    # Server block: listening on port 9999, forward to backend.
    server {
        listen 9999;
        server_name _;

        # Proxy settings para encaminhar requisições.
        location / {
            proxy_pass http://cocorico_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffer settings
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
